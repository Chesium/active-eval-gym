[project]
name = "active-eval-gym"
version = "0.1.0"
description = "A reproducible sandbox for evaluating fixed policies under controlled environment perturbations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "control>=0.10.2,<0.11",
    "gymnasium>=1.3.0,<2",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.0,<4",
    "minigrid>=3.1.0,<4",
    "numpy>=2.5.0,<3",
    "stable-baselines3>=2.9.0,<3",
]

[project.scripts]
active-eval-gym = "active_eval_gym.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "ruff>=0.13.0,<1",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --disable-plugin-autoload"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
