schema_version = 1
spec_id = "pendulum-v1-nominal-v1"
environment_id = "Pendulum-v1"
max_episode_steps = 200

[parameters]
g = 10.0
m = 1.0
l = 1.0
dt = 0.05
max_speed = 8.0
max_torque = 2.0

[initial_state_distribution]
kind = "independent_uniform"
state_order = ["angle", "angular_velocity"]
low = [-3.141592653589793, -1.0]
high = [3.141592653589793, 1.0]
